name: Release Assets

on:
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform and libraries
        run: |
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json,https://raw.githubusercontent.com/stm32duino/BoardManagerFiles/main/package_stmicroelectronics_index.json,https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json,https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install arduino:avr
          arduino-cli core install rp2040:rp2040 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install STMicroelectronics:stm32 --additional-urls https://raw.githubusercontent.com/stm32duino/BoardManagerFiles/main/package_stmicroelectronics_index.json
          CORE_DIR=$HOME/.arduino15/packages/STMicroelectronics/hardware/stm32
          if [ -d "$CORE_DIR" ]; then
            BOARDS_TXT=$(find $CORE_DIR -name boards.txt | head -n 1)
            if [ -f "$BOARDS_TXT" ]; then
              if ! grep -q "GENERIC_C542RCTX" "$BOARDS_TXT"; then
                cat << 'EOF' >> "$BOARDS_TXT"

# Generic C542RCTx
GenC5.menu.pnum.GENERIC_C542RCTX=Generic C542RCTx
GenC5.menu.pnum.GENERIC_C542RCTX.upload.maximum_size=262144
GenC5.menu.pnum.GENERIC_C542RCTX.upload.maximum_data_size=65536
GenC5.menu.pnum.GENERIC_C542RCTX.build.board=GENERIC_C542RCTX
GenC5.menu.pnum.GENERIC_C542RCTX.build.product_line=STM32C542xx
GenC5.menu.pnum.GENERIC_C542RCTX.build.variant=STM32C5xx/C532R(B-C)T_C542RCT
GenC5.menu.pnum.GENERIC_C542RCTX.debug.svd_file={runtime.tools.STM32_SVD.path}/svd/STM32C5xx/STM32C542.svd
EOF
              fi
              if ! grep -q "NUCLEO_C542RC" "$BOARDS_TXT"; then
                cat << 'EOF' >> "$BOARDS_TXT"

# NUCLEO_C542RC board
Nucleo_64.menu.pnum.NUCLEO_C542RC=Nucleo C542RC
Nucleo_64.menu.pnum.NUCLEO_C542RC.node="NOD_C542RC"
Nucleo_64.menu.pnum.NUCLEO_C542RC.upload.maximum_size=262144
Nucleo_64.menu.pnum.NUCLEO_C542RC.upload.maximum_data_size=65536
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.mcu=cortex-m33
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.fpu=-mfpu=fpv5-sp-d16
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.float-abi=-mfloat-abi=hard
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.hal=-DUSE_HALV2_DRIVER
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.board=GENERIC_C542RCTX
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.series=STM32C5xx
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.product_line=STM32C542xx
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.variant=STM32C5xx/C532R(B-C)T_C542RCT
Nucleo_64.menu.pnum.NUCLEO_C542RC.build.variant_h=variant_generic.h
Nucleo_64.menu.pnum.NUCLEO_C542RC.debug.svd_file={runtime.tools.STM32_SVD.path}/svd/STM32C5xx/STM32C542.svd
EOF
              fi
            fi
            SRC_LD=$(find $CORE_DIR -path "*/C552R*" -name "ldscript.ld" | head -n 1)
            DST_DIR=$(find $CORE_DIR -path "*/C532R*" -type d | head -n 1)
            if [ -n "$SRC_LD" ] && [ -n "$DST_DIR" ] && [ ! -f "$DST_DIR/ldscript.ld" ]; then
              cp "$SRC_LD" "$DST_DIR/ldscript.ld"
            fi
          fi
          arduino-cli core install Seeeduino:renesas_uno --additional-urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install Servo

      - name: Link library
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/MiniPirate

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:uno -e examples/Minipirate/Minipirate.ino
          arduino-cli compile --fqbn rp2040:rp2040:rpipico -e examples/Minipirate/Minipirate.ino
          arduino-cli compile --fqbn rp2040:rp2040:rpipico2 -e examples/Minipirate/Minipirate.ino
          arduino-cli compile --fqbn rp2040:rp2040:seeed_xiao_rp2040 -e examples/Minipirate/Minipirate.ino
          arduino-cli compile --fqbn rp2040:rp2040:seeed_xiao_rp2350 -e examples/Minipirate/Minipirate.ino
          arduino-cli compile --fqbn Seeeduino:renesas_uno:XIAO_RA4M1 -e examples/Minipirate/Minipirate.ino

          # STM32 NUCLEO-G431RB
          arduino-cli compile --fqbn STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_G431RB -e examples/Minipirate/Minipirate.ino
          mkdir -p examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-g431rb
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.bin examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-g431rb/
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.hex examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-g431rb/

          # STM32 NUCLEO-F446RE
          arduino-cli compile --fqbn STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_F446RE -e examples/Minipirate/Minipirate.ino
          mkdir -p examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-f446re
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.bin examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-f446re/
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.hex examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-f446re/

          # STM32 NUCLEO-C542RC
          arduino-cli compile --fqbn STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_C542RC -e examples/Minipirate/Minipirate.ino
          mkdir -p examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-c542rc
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.bin examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-c542rc/
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64/Minipirate.ino.hex examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-c542rc/

          # Seeed Studio XIAO ESP32-C6
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6 -e examples/Minipirate/Minipirate.ino

      - name: Prepare Release Assets
        run: |
          mkdir -p assets
          cp examples/Minipirate/build/arduino.avr.uno/Minipirate.ino.hex assets/Minipirate-uno.hex
          cp examples/Minipirate/build/arduino.avr.uno/Minipirate.ino.with_bootloader.hex assets/Minipirate-uno-with_bootloader.hex
          cp examples/Minipirate/build/rp2040.rp2040.rpipico/Minipirate.ino.bin assets/Minipirate-rpipico.bin
          cp examples/Minipirate/build/rp2040.rp2040.rpipico/Minipirate.ino.uf2 assets/Minipirate-rpipico.uf2
          cp examples/Minipirate/build/rp2040.rp2040.rpipico2/Minipirate.ino.bin assets/Minipirate-rpipico2.bin
          cp examples/Minipirate/build/rp2040.rp2040.rpipico2/Minipirate.ino.uf2 assets/Minipirate-rpipico2.uf2
          cp examples/Minipirate/build/rp2040.rp2040.seeed_xiao_rp2040/Minipirate.ino.bin assets/Minipirate-xiao_rp2040.bin
          cp examples/Minipirate/build/rp2040.rp2040.seeed_xiao_rp2040/Minipirate.ino.uf2 assets/Minipirate-xiao_rp2040.uf2
          cp examples/Minipirate/build/rp2040.rp2040.seeed_xiao_rp2350/Minipirate.ino.bin assets/Minipirate-xiao_rp2350.bin
          cp examples/Minipirate/build/rp2040.rp2040.seeed_xiao_rp2350/Minipirate.ino.uf2 assets/Minipirate-xiao_rp2350.uf2
          cp examples/Minipirate/build/Seeeduino.renesas_uno.XIAO_RA4M1/Minipirate.ino.bin assets/Minipirate-xiao_ra4m1.bin
          cp examples/Minipirate/build/Seeeduino.renesas_uno.XIAO_RA4M1/Minipirate.ino.hex assets/Minipirate-xiao_ra4m1.hex
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-g431rb/Minipirate.ino.bin assets/Minipirate-nucleo_g431rb.bin
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-g431rb/Minipirate.ino.hex assets/Minipirate-nucleo_g431rb.hex
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-f446re/Minipirate.ino.bin assets/Minipirate-nucleo_f446re.bin
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-f446re/Minipirate.ino.hex assets/Minipirate-nucleo_f446re.hex
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-c542rc/Minipirate.ino.bin assets/Minipirate-nucleo_c542rc.bin
          cp examples/Minipirate/build/STMicroelectronics.stm32.Nucleo_64-c542rc/Minipirate.ino.hex assets/Minipirate-nucleo_c542rc.hex
          cp examples/Minipirate/build/esp32.esp32.XIAO_ESP32C6/Minipirate.ino.bin assets/Minipirate-xiao_esp32c6.bin

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/Minipirate-uno.hex
            assets/Minipirate-uno-with_bootloader.hex
            assets/Minipirate-rpipico.bin
            assets/Minipirate-rpipico.uf2
            assets/Minipirate-rpipico2.bin
            assets/Minipirate-rpipico2.uf2
            assets/Minipirate-xiao_rp2040.bin
            assets/Minipirate-xiao_rp2040.uf2
            assets/Minipirate-xiao_rp2350.bin
            assets/Minipirate-xiao_rp2350.uf2
            assets/Minipirate-xiao_ra4m1.bin
            assets/Minipirate-xiao_ra4m1.hex
            assets/Minipirate-nucleo_g431rb.bin
            assets/Minipirate-nucleo_g431rb.hex
            assets/Minipirate-nucleo_f446re.bin
            assets/Minipirate-nucleo_f446re.hex
            assets/Minipirate-nucleo_c542rc.bin
            assets/Minipirate-nucleo_c542rc.hex
            assets/Minipirate-xiao_esp32c6.bin
